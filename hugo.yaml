baseURL: 'https://jmoxon.net/'
locale: en-US
title: 'Theme site'

pagination:
  pagerSize: 10

menus:
  main:
    - name: Home
      pageRef: /
      weight: 10
    - name: About
      pageRef: /authors/
      weight: 20
    - name: Contact
      pageRef: /contact
      weight: 30

params:
  subtitle: "Subtitle here"
  # description: Text about my cool site
  mainSections:
    - "articles"

  # Show the light/dark toggle in the navbar. The site follows the visitor's
  # system preference either way.
  themeToggle: true

  # Analytics integrations. Each one is included only when its block is set,
  # and only in production builds (hugo / netlify, not hugo server).
  services:
    # plausible:
    #   src: "https://analytics.example.net/js/script.js"
    # googletag:
    #   id: G-XXXXXXXXXX
    # umami:
    #   id: 00000000-0000-0000-0000-000000000000   # data-website-id
    #   src: "https://analytics.example.net/s.js"
    #   recorder: "https://analytics.example.net/recorder.js"  # optional session recorder

  imaging:
    aspectRatios:
      '3/2':
        srcset:
          - [320, 213]
          - [640, 427]
          - [1024, 683]
          - [1280, 853]
          - [1420, 947]
        sizes:
          - "(min-width: 1024px) 60vw"
          - "90vw"
      '1/1':
        srcset:
          - [70, 70]
          - [160, 160]
          - [320, 320]
        sizes:
          - "(min-width: 768px) 20vw"
          - "70px"

  author:
    name: John
    social:
      linkedin:
        user: johnmoxon
      twitter:
        user: johnmoxon

imaging:
  bgColor: '#ffffff'
  webp:
    hint: photo
  quality: 80
  resampleFilter: Box
  anchor: "Center"

taxonomies:
  categories: categories
  tags: tags
  authors: authors

module:
  hugoVersion:
    extended: false
    min: 0.158.0
  imports:
    # Bulma 1.x Sass sources, compiled with Dart Sass (assets/scss/main.scss)
    - path: github.com/jgthms/bulma
      mounts:
        - source: sass
          target: assets/bulma

# Local development against the real site content:
#   cd ../jmoxon.net
#   HUGO_MODULE_REPLACEMENTS="github.com/johnmoxon/jmoxon-theme -> $PWD/../jmoxon-theme" hugo server
