{{- /* Light/dark toggle. Behaviour lives in assets/js/main.js. A toggle button
with a fixed name: aria-pressed tells assistive tech whether dark is on. */ -}}
{{- if site.Params.themeToggle | default true }}
<button type="button" class="theme-toggle icon-link" data-theme-toggle aria-pressed="false" aria-label="Dark theme" title="Dark theme">
  <span class="theme-toggle-dark">{{ partial "icon.html" "moon" }}</span>
  <span class="theme-toggle-light">{{ partial "icon.html" "sun" }}</span>
</button>
{{- end }}
